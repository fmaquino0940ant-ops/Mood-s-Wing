<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood's Wing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="register-page">
  <section class="register-left">
    <form class="cream-card" action="#" method="post">
      <h2>Register</h2>

      <label for="fullname">FULL NAME</label>
      <input type="text" id="fullname" class="line-input" placeholder="John Doe" required>

      <label for="email">EMAIL</label>
      <input type="email" id="email" class="line-input" placeholder="johndoe@gmail.com" required>

      <label for="password">PASSWORD</label>
      <input type="password" id="password" class="line-input" placeholder="••••••" required>

      <label class="check"><input type="checkbox" required> I agree to the Terms and Privacy Policy</label>

      <button type="submit" class="btn btn-green btn-block">Sign Up</button>

      <p class="form-note">Already have an account? <a href="login.html"><strong>Login</strong></a></p>

      <div class="social-login">
        <a href="#"><img src="images/facebook-1-svgrepo-com.svg" alt="Facebook"></a>
        <a href="#"><img src="images/google-gmail-svgrepo-com.svg" alt="Gmail"></a>
      </div>
    </form>
  </section>

  <section class="register-right">
    <img class="register-logo" src="images/Logo.png" alt="Moods Wing">
    <img class="register-photo" src="images/registration(edited).jpg" alt="">
  </section>
</body>
</html>
